name: Build & Publish Docker Image

# 触发方式：推送 v* 标签（gh release create 会自动打标签）或手动运行
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # GHCR 新包默认私有，发布后自动改为 public
      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 包名 = 仓库名（ghcr.io/{owner}/{repo} 的最后一段）
          PKG="${{ github.event.repository.name }}"
          for pkg in "user/packages/container/$PKG" "orgs/${{ github.repository_owner }}/packages/container/$PKG"; do
            echo "尝试: $pkg"
            if gh api "$pkg/visibility" --method PATCH -f visibility=public > /dev/null 2>&1; then
              echo "✓ 已设为 public"
              break
            else
              echo "该端点失败，试下一个"
            fi
          done
